<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>portfolio</title>
<meta name="description" content="Portfolio de projetos de código." />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=2611121329" />
</head>
<body class="is-booting">

<!-- Todo o texto vem de js/data.js. Edite lá, não aqui. -->

<div id="boot" class="boot" role="status" aria-label="Carregando">
  <p class="boot__tag" id="bootTag"></p>
  <div class="boot__bar"><span id="bootFill"></span></div>
  <div class="boot__pct" id="bootPct">000</div>
</div>

<canvas id="trk" class="trk" aria-hidden="true"></canvas>

<div class="ctl">
  <button class="ctl__b" id="invertToggle" aria-pressed="false">inverter</button>
</div>

<main>

<!-- 01 · CAPA -->
<section class="sec hero" id="hero">
  <canvas class="el" data-art="star" data-trk style="--x:17;--y:80;--w:80;--d:1.6" aria-hidden="true"></canvas>
  <canvas class="el" data-art="star" data-trk style="--x:99;--y:20;--w:54;--d:.8" aria-hidden="true"></canvas>
  <h1 class="line lay">
    <span id="heroA"></span>
    <canvas class="cut" data-art="floppy" data-trk aria-hidden="true"></canvas>
    <span id="heroB"></span>
  </h1>
  <p class="role lay" id="heroRole"></p>
  <a class="cue" href="#work" aria-label="Ir para os projetos"><i></i></a>
</section>

<!-- 02 · PROJETOS -->
<section class="sec machine" id="work">
  <canvas class="el" data-art="burst" style="--x:60;--y:47;--w:108;--d:.5" aria-hidden="true"></canvas>
  <div class="machine__stage" id="machine">
    <canvas id="pspCanvas" role="img" aria-label="PSP mostrando o projeto selecionado"></canvas>
    <div class="machine__loading" id="pspLoading"><i class="spin" aria-hidden="true"></i></div>
  </div>
  <div class="rail lay" aria-live="polite">
    <div class="rail__count"><b id="railIdx">01</b><i id="railTot">/00</i></div>
    <div class="rail__txt"><strong id="railTitle"></strong><span id="railMeta"></span></div>
  </div>
  <div class="keys lay">
    <button id="prevBtn" aria-label="Projeto anterior">←</button>
    <button id="nextBtn" aria-label="Próximo projeto">→</button>
    <a id="railOpen" href="#" target="_blank" rel="noopener" aria-label="Abrir este projeto">↗</a>
  </div>
</section>

<!-- 03 · SOBRE -->
<section class="sec about" id="about">
  <canvas class="el" data-art="chip" data-trk style="--x:13;--y:19;--w:66;--d:1.2" aria-hidden="true"></canvas>
  <div class="about__body lay">
    <h2 id="aboutH"></h2>
    <div id="aboutBio"></div>
    <ul class="stack" id="aboutStack"></ul>
  </div>
</section>

<!-- 04 · CONTATO -->
<section class="sec contact" id="contact">
  <canvas class="el" data-art="cursor" data-trk style="--x:86;--y:74;--w:34;--d:1.4" aria-hidden="true"></canvas>
  <h2 class="line lay">
    <span id="contactA"></span>
    <canvas class="cut" data-art="at" data-trk aria-hidden="true"></canvas>
    <span id="contactB"></span>
  </h2>
  <nav class="links lay" id="links" aria-label="Contato"></nav>
  <p class="credit lay">
    PSP 3D: <a href="https://sketchfab.com/3d-models/sony-psp-dca89d10ec304d0cab76837750df7761" target="_blank" rel="noopener">“Sony PSP”</a>
    por <a href="https://sketchfab.com/strov" target="_blank" rel="noopener">Ilya Ostrovsky</a>,
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
  </p>
</section>

</main>

<noscript><p style="padding:2rem;font-family:sans-serif">Este portfolio precisa de JavaScript para funcionar.</p></noscript>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
} }
</script>
<script src="js/data.js?v=2611121329"></script>
<script src="js/art.js?v=2611121329"></script>
<script src="js/main.js?v=2611121329"></script>
<script src="js/track.js?v=2611121329"></script>
<script type="module" src="js/psp.js?v=2611121329"></script>
</body>
</html>
