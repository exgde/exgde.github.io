<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>portfolio</title>
<meta name="description" content="Portfolio de projetos de código." />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=2611132200" />
</head>
<body class="is-booting">

<!-- Todo o texto vem de js/data.js. Edite lá, não aqui. -->

<div id="boot" class="boot" role="status" aria-label="Carregando" data-t-aria="loading">
  <p class="boot__tag" id="bootTag"></p>
  <div class="boot__bar"><span id="bootFill"></span></div>
  <div class="boot__pct" id="bootPct">000</div>
</div>

<canvas id="trk" class="trk" aria-hidden="true"></canvas>

<div class="ctl">
  <button class="ctl__b ctl__lang" id="langToggle" type="button"></button>
  <button class="ctl__b ctl__inv" id="invertToggle" type="button" aria-pressed="false" aria-label="inverter" title="inverter" data-t-aria="invert" data-t-title="invert"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg></button>
</div>

<main>

<!-- 01 · CAPA + PROJETOS
     Sequência de entrada (main.js): o nome surge no centro, desliza para a
     esquerda, o PSP aparece e a descrição do projeto entra ao lado dele. -->
<section class="sec stage" id="hero">
  <canvas class="el" data-art="star" data-trk style="--x:10;--y:86;--w:62;--d:1.6" aria-hidden="true"></canvas>
  <canvas class="el" data-art="star" data-trk style="--x:99;--y:12;--w:44;--d:.8" aria-hidden="true"></canvas>
  <canvas class="el el--late" data-art="burst" style="--x:49;--y:50;--w:82;--d:.5" aria-hidden="true"></canvas>

  <div class="brand" id="brand">
    <h1 class="line">
      <span class="brand__w" id="heroA"></span>
      <canvas class="cut brand__cut" data-art="floppy" data-trk aria-hidden="true"></canvas>
      <span class="brand__w brand__w--b" id="heroB"></span>
    </h1>
    <p class="role" id="heroRole"></p>
  </div>

  <div class="machine__stage" id="machine">
    <canvas id="pspCanvas" role="img" aria-label="PSP mostrando o projeto selecionado" data-t-aria="pspLabel"></canvas>
    <div class="machine__loading" id="pspLoading"><i class="spin" aria-hidden="true"></i></div>
  </div>

  <aside class="info" id="info" aria-live="polite" aria-label="Sobre o projeto na tela" data-t-aria="infoLabel">
    <div class="info__in" id="infoIn">
      <div class="info__count" style="--i:0"><b id="railIdx">01</b><i id="railTot">/00</i></div>
      <h2 class="info__title" id="railTitle" style="--i:1"></h2>
      <p class="info__sub" id="infoSub" style="--i:2"></p>
      <dl class="info__dl">
        <div style="--i:3"><dt data-t="how">como fiz</dt><dd id="infoHow"></dd></div>
        <div style="--i:4"><dt data-t="why">pra quê</dt><dd id="infoWhy"></dd></div>
      </dl>
      <p class="info__meta" id="railMeta" style="--i:5"></p>
    </div>
  </aside>

  <!-- anterior / próximo / abrir: discretos, no canto -->
  <nav class="keys" aria-label="Navegar pelos projetos" data-t-aria="keysLabel">
    <button id="prevBtn" aria-label="Projeto anterior" data-t-aria="prev">←</button>
    <button id="nextBtn" aria-label="Próximo projeto" data-t-aria="next">→</button>
    <a id="railOpen" href="#" target="_blank" rel="noopener" aria-label="Abrir este projeto" data-t-aria="open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3.5"/><path d="M14 4h6v6M20 4l-8.5 8.5"/></svg></a>
  </nav>

  <!-- som do clipe: no canto superior direito da tela do PSP -->
  <div class="keys keys--snd">
    <button id="sndBtn" type="button" aria-pressed="false" aria-label="Som do vídeo" data-t-aria="sound"><svg class="snd__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg><svg class="snd__off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  </div>

  <a class="cue" href="#about" aria-label="Ir para o sobre" data-t-aria="cue"><canvas aria-hidden="true"></canvas></a>
</section>

<!-- 02 · SOBRE
     Esquerda: três fileiras de desenhos num plano em perspectiva, cada uma
     deslizando para um lado (main.js monta, CSS anima).
     Direita: o cartão com o "sobre mim". -->
<section class="sec about" id="about">
  <div class="about__wrap lay">
    <div class="art">
      <header class="art__h" id="artH">
        <p class="art__k"><span id="artK"></span><i aria-hidden="true"></i></p>
        <h2 class="art__t" id="artT"></h2>
        <p class="art__s" id="artS"></p>
      </header>
      <div class="gallery" id="gallery" aria-label="Desenhos" data-t-aria="gallery">
        <div class="gallery__plane" id="galleryPlane"></div>
      </div>
    </div>

    <article class="card">
      <h2 class="card__h" id="aboutH"></h2>
      <p class="card__lead" id="aboutLead"></p>
      <div class="card__bio" id="aboutBio"></div>
      <ul class="card__built" id="aboutBuilt"></ul>
      <p class="card__now" id="aboutNow"></p>
      <nav class="card__links" id="aboutLinks" aria-label="Onde ver mais" data-t-aria="moreLinks"></nav>
      <figure class="me" id="me">
        <img id="meImg" alt="" width="593" height="1140" decoding="async" data-trk />
        <img class="me__light" id="meLight" alt="" width="593" height="1140" decoding="async" aria-hidden="true" />
      </figure>
    </article>
  </div>
</section>

<!-- 04 · CONTATO -->
<section class="sec contact" id="contact">
  <canvas class="el" data-art="cursor" data-trk style="--x:90;--y:16;--w:30;--d:1.4" aria-hidden="true"></canvas>
  <!-- recortes para os lados não ficarem vazios: el--side some em telas estreitas, el--wide só aparece em telas largas -->
  <canvas class="el el--side" data-art="braces" data-trk style="--x:9;--y:30;--w:20;--d:1.1" aria-hidden="true"></canvas>
  <canvas class="el el--side" data-art="star" style="--x:24;--y:11;--w:10;--d:.7" aria-hidden="true"></canvas>
  <canvas class="el el--side" data-art="star" style="--x:79;--y:41;--w:8;--d:.9" aria-hidden="true"></canvas>
  <canvas class="el el--wide" data-art="star" style="--x:9;--y:80;--w:24;--d:1.6" aria-hidden="true"></canvas>
  <canvas class="el el--wide" data-art="chip" data-trk style="--x:91;--y:64;--w:15;--d:1.2" aria-hidden="true"></canvas>

  <div class="contact__wrap">
    <header class="contact__head lay">
      <p class="kick"><span id="contactK"></span><i aria-hidden="true"></i></p>
      <h2 class="line">
        <span id="contactA"></span>
        <canvas class="cut" data-art="at" data-trk aria-hidden="true"></canvas>
        <span id="contactB"></span>
      </h2>
      <p class="contact__note" id="contactNote"></p>
      <div class="mail">
        <a class="mail__a" id="mailA" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><span id="mailT"></span></a>
        <button class="mail__copy" id="mailCopy" type="button" data-t="copy">copiar</button>
      </div>
    </header>

    <nav class="hubs" id="hubs" aria-label="Onde me encontrar" data-t-aria="hubs"></nav>
  </div>

  <!-- créditos: no fim da página, centralizados e discretos; aparecem quando o rodapé entra na tela (main.js) -->
  <footer class="foot" id="foot">
    <p class="foot__i"><span data-t="origRepo">portfolio original</span> <a href="https://github.com/shutterkif-oss/shutterkif-oss.github.io" target="_blank" rel="noopener">shutterkif-oss.github.io</a></p>
    <i class="foot__sep" aria-hidden="true"></i>
    <p class="foot__i"><span data-t="pspModel">modelo do PSP</span> <a href="https://sketchfab.com/3d-models/sony-psp-dca89d10ec304d0cab76837750df7761" target="_blank" rel="noopener">“Sony PSP”</a>
      <span data-t="by">por</span> <a href="https://sketchfab.com/strov" target="_blank" rel="noopener">Ilya Ostrovsky</a>
      · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></p>
  </footer>
</section>

</main>

<!-- desenho em tela cheia (js/gallery.js) -->
<dialog class="lb" id="lb" aria-label="Desenho em tela cheia" data-t-aria="lbLabel">
  <div class="lb__stage"><img id="lbImg" alt="" draggable="false" /></div>
  <div class="lb__bar">
    <span class="lb__n" id="lbN"></span>
    <span class="lb__cap" id="lbCap"></span>
    <a class="lb__link" id="lbLink" href="#" target="_blank" rel="noopener" data-t="lbLink">ver no artstation</a>
  </div>
  <button class="lb__b lb__prev" id="lbPrev" type="button" aria-label="Desenho anterior" data-t-aria="lbPrev">←</button>
  <button class="lb__b lb__next" id="lbNext" type="button" aria-label="Próximo desenho" data-t-aria="lbNext">→</button>
  <button class="lb__b lb__close" id="lbClose" type="button" aria-label="Fechar" data-t-aria="lbClose">✕</button>
</dialog>

<noscript><p style="padding:2rem;font-family:sans-serif">Este portfolio precisa de JavaScript para funcionar. · This portfolio needs JavaScript to work.</p></noscript>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
} }
</script>
<script src="js/data.js?v=2611132200"></script>
<script src="js/i18n.js?v=2611132200"></script>
<script src="js/icons.js?v=2611132200"></script>
<script src="js/art.js?v=2611132200"></script>
<script src="js/main.js?v=2611132200"></script>
<script src="js/cue.js?v=2611132200"></script>
<script src="js/gallery.js?v=2611132200"></script>
<script src="js/track.js?v=2611132200"></script>
<script type="module" src="js/psp.js?v=2611132200"></script>
</body>
</html>
